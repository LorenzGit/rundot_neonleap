<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
        <meta name="theme-color" content="#05070F" />
        <meta name="color-scheme" content="dark" />
        <link rel="icon" href="./thumbnail.jpg" type="image/jpeg" />
        <title>NEONLEAP</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #05070f;
            }
            #boot-cover {
                position: fixed;
                inset: 0;
                z-index: 999;
                display: grid;
                place-items: center;
                color: #eaf2ff;
                background:
                    radial-gradient(120% 90% at 50% 115%, #1b2242 0%, #0b1026 48%, #05070f 100%);
                transition: opacity 260ms ease;
                font-family: "Avenir Next Condensed", "Arial Narrow", Impact, system-ui, sans-serif;
            }
            #boot-cover.hidden {
                opacity: 0;
                pointer-events: none;
            }
            .boot-panel {
                width: min(84vw, 560px);
                text-align: center;
            }
            .boot-wordmark {
                font-size: clamp(44px, 11vw, 96px);
                font-weight: 800;
                letter-spacing: 0.09em;
                line-height: 0.95;
                color: #eaf2ff;
                text-shadow:
                    0 0 14px rgba(61, 245, 255, 0.85),
                    0 0 42px rgba(61, 245, 255, 0.4),
                    3px 3px 0 rgba(255, 61, 240, 0.55),
                    0 0 90px rgba(255, 61, 240, 0.3);
            }
            .boot-wordmark em {
                font-style: normal;
                color: #3df5ff;
            }
            .boot-city {
                position: relative;
                height: 46px;
                margin: 20px auto 14px;
                width: min(320px, 70vw);
                overflow: hidden;
                border-bottom: 2px solid rgba(61, 245, 255, 0.8);
                box-shadow: 0 10px 24px -12px rgba(61, 245, 255, 0.7);
            }
            .boot-city::before,
            .boot-city::after {
                content: "";
                position: absolute;
                inset: 0;
                background:
                    linear-gradient(transparent 0 55%, #0d1230 55%) left bottom / 26px 100% repeat-x;
                opacity: 0.9;
                animation: boot-scroll 5s linear infinite;
            }
            .boot-city::after {
                background:
                    linear-gradient(transparent 0 30%, #10173a 30%) left bottom / 41px 100% repeat-x;
                opacity: 0.55;
                animation-duration: 9s;
            }
            .boot-runner {
                position: absolute;
                left: 26%;
                bottom: 4px;
                width: 7px;
                height: 16px;
                border-radius: 3px;
                background: #eaf2ff;
                box-shadow: 0 0 10px rgba(234, 242, 255, 0.9);
                animation: boot-hop 0.9s ease-in-out infinite;
                z-index: 2;
            }
            .boot-runner::after {
                content: "";
                position: absolute;
                right: 6px;
                top: 2px;
                width: 14px;
                height: 3px;
                border-radius: 2px;
                background: #ff3df0;
                box-shadow: 0 0 8px rgba(255, 61, 240, 0.9);
            }
            @keyframes boot-hop {
                0%,
                100% {
                    transform: translateY(0);
                }
                40% {
                    transform: translateY(-16px);
                }
                60% {
                    transform: translateY(-14px);
                }
            }
            @keyframes boot-scroll {
                from {
                    background-position-x: 0;
                }
                to {
                    background-position-x: -320px;
                }
            }
            .boot-bar {
                height: 5px;
                border-radius: 3px;
                overflow: hidden;
                background: rgba(61, 245, 255, 0.14);
                margin: 0 auto;
                width: min(320px, 70vw);
            }
            #boot-fill {
                height: 100%;
                width: 4%;
                border-radius: 3px;
                background: linear-gradient(90deg, #3df5ff, #ff3df0);
                box-shadow: 0 0 12px rgba(61, 245, 255, 0.9);
                transition: width 220ms ease;
            }
            #boot-copy {
                margin-top: 12px;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.34em;
                color: rgba(159, 216, 255, 0.72);
            }
            @media (prefers-reduced-motion: reduce) {
                .boot-runner,
                .boot-city::before,
                .boot-city::after {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <div id="app-frame">
            <div id="scene-host"></div>
            <div id="ui-root"></div>
            <button id="performance-hud" class="hidden" aria-label="Performance readout">
                <span id="performance-fps"></span>
                <span id="performance-frame"></span>
                <span id="performance-detail"></span>
                <span id="performance-renderer-reason"></span>
            </button>
        </div>
        <div id="boot-cover">
            <div class="boot-panel">
                <div class="boot-wordmark">NEON<em>LEAP</em></div>
                <div class="boot-city"><div class="boot-runner"></div></div>
                <div class="boot-bar"><div id="boot-fill"></div></div>
                <div id="boot-copy">WAKING THE SKYLINE</div>
            </div>
        </div>
        <!--
            Boot watchdog.

            Every recovery path in this game lives inside main.ts: the boot()
            catch, the host handshake timeout, the asset timeouts. All of them
            need the module bundle to have executed. When the bundle itself
            never fetches, never parses, or throws at import time on an old
            WebView, none of it runs and #boot-cover stays up forever with an
            animating progress bar and no way out — the player just sees a
            loading screen that never ends.

            A classic script on purpose: it must run even when the module graph
            is the thing that failed. Cleared by liftBootCover(), so it can
            never fire behind a healthy boot.
        -->
        <script>
            (function () {
                var timer = window.setTimeout(function () {
                    var cover = document.getElementById("boot-cover");
                    if (!cover || cover.classList.contains("hidden")) return;
                    var copy = document.getElementById("boot-copy");
                    if (copy) copy.textContent = "COULD NOT LOAD";
                    var bar = cover.querySelector(".boot-bar");
                    if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
                    var panel = cover.querySelector(".boot-panel") || cover;
                    var hint = document.createElement("p");
                    hint.textContent = "Check your connection and reload.";
                    hint.style.cssText = "margin:10px 0 0;font-size:13px;opacity:.8";
                    var retry = document.createElement("button");
                    retry.type = "button";
                    retry.textContent = "RELOAD";
                    retry.style.cssText =
                        "margin-top:14px;min-height:44px;padding:0 22px;font:inherit;font-size:14px;" +
                        "cursor:pointer;border:1px solid currentColor;border-radius:8px;" +
                        "background:transparent;color:inherit";
                    retry.addEventListener("click", function () { window.location.reload(); });
                    panel.appendChild(hint);
                    panel.appendChild(retry);
                }, 20000);
                window.__bootWatchdog = timer;
            })();
        </script>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
